services:
  users-auth-service:
    build:
      context: ./spring-backend
      dockerfile: Dockerfile
    container_name: users-auth-service
    environment:
      SERVER_PORT: 8081
      SERVICE_JAR: auth-service.jar
      APP_CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8081:8081"

  api-gateway:
    build:
      context: ./spring-backend
      dockerfile: Dockerfile
    container_name: api-gateway
    environment:
      SERVER_PORT: 8080
      SERVICE_JAR: api-gateway.jar
      USERS_SERVICE_URL: http://users-auth-service:8081
      MASCOTAS_SERVICE_URL: http://localhost:8094
      REPORTS_SERVICE_URL: http://localhost:8095
      SEARCH_SERVICE_URL: http://localhost:8097
      GEOLOCATION_SERVICE_URL: http://localhost:8091
      MATCHING_SERVICE_URL: http://localhost:8092
      NOTIFICATIONS_SERVICE_URL: http://localhost:8098
    depends_on:
      - users-auth-service
    ports:
      - "8080:8080"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: sanos-salvos-frontend
    environment:
      VITE_API_GATEWAY_URL: http://localhost:8080
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - api-gateway
    ports:
      - "5173:5173"
